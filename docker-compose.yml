# 3 services : base MySQL, backend Spring Boot, frontend Nginx
# Le mot de passe de la base vient de la variable DB_PASSWORD (valeur par défaut de démonstration)
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-achat-pass}
      MYSQL_DATABASE: achat
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ${DOCKERHUB_USER:-franckarmand225}/achat-backend:${TAG:-latest}
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/achat
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-achat-pass}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USER:-franckarmand225}/achat-frontend:${TAG:-latest}
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  db_data:
